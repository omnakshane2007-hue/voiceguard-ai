[project]
name = "voiceguardai"
version = "0.1.0"
description = "VOICEGUARD AI - Real-Time Voice Cloning Detection System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask",
]

[tool.vercel]
entrypoint = "index:app"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [
    ".",
    "aasist",
    ".venv/Lib/site-packages"
]
